# Policy creation writes to eBay immediately. Review all terms before use.
paymentPolicy:
  marketplaceId: EBAY_US
  name: CLI Payment Policy
  categoryTypes:
    - name: ALL_EXCLUDING_MOTORS_VEHICLES
      default: true
  immediatePay: true
  # eBay managed payments do not require legacy PayPal payment-method entries here.
fulfillmentPolicy:
  marketplaceId: EBAY_US
  name: CLI Fulfillment Policy
  categoryTypes:
    - name: ALL_EXCLUDING_MOTORS_VEHICLES
      default: true
  handlingTime:
    value: 1
    unit: DAY
  shippingOptions:
    - optionType: DOMESTIC
      costType: FLAT_RATE
      shippingServices:
        - shippingCarrierCode: USPS
          # Confirm supported service codes and rates for your marketplace.
          shippingServiceCode: USPSPriority
          shippingCost:
            value: "9.99"
            currency: USD
returnPolicy:
  marketplaceId: EBAY_US
  name: CLI Return Policy
  categoryTypes:
    - name: ALL_EXCLUDING_MOTORS_VEHICLES
      default: true
  returnsAccepted: true
  returnPeriod:
    unit: DAY
    value: 30
  # Money-back refunds are the default. returnMethod is only for replacements.
  returnShippingCostPayer: BUYER
