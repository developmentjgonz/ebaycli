name: Feature request
description: Propose a focused improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow and who needs it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Show an example command or expected result where helpful.
    validations:
      required: true
